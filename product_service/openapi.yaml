openapi: 3.0.3
info:
  title: Product Service API
  version: 1.0.0
  description: API for the product catalog and optional Cognito-protected practice flow.
paths:
  /products:
    get:
      summary: Get products list
      description: Returns the full list of products.
      security:
        - CognitoAuth: []
      responses:
        '200':
          description: Successful response with product array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized request.
        '403':
          description: Forbidden request.
    post:
      summary: Create product
      description: Creates a new product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: Product created.
        '400':
          description: Invalid payload.
  /products/{productId}:
    get:
      summary: Get product by ID
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found.
components:
  securitySchemes:
    CognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        count:
          type: integer
      required:
        - id
        - title
        - price
        - count
    NewProduct:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        count:
          type: integer
      required:
        - title
        - description
        - price
        - count

